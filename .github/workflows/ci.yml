name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The package declares support for NestJS 10, 11 and 12 in
  # peerDependencies; the main job tests against 12 (the dev dependencies),
  # this one proves the older majors.
  compat-nestjs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nestjs-version: [10, 11]
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Downgrade NestJS to v${{ matrix.nestjs-version }}
        run: npm install --no-save @nestjs/common@^${{ matrix.nestjs-version }} @nestjs/core@^${{ matrix.nestjs-version }} @nestjs/platform-express@^${{ matrix.nestjs-version }} @nestjs/platform-fastify@^${{ matrix.nestjs-version }} @nestjs/testing@^${{ matrix.nestjs-version }}

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test
